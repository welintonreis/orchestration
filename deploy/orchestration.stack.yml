version: "3.9"

services:
  web:
    image: ${IMAGE:-registry.gitlab.redhusky.com.br/redhusk/orchestration:latest}
    environment:
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
      # App -> HAProxy -> PgBouncer -> Postgres (primary/réplicas), ver
      # ~/docker/postgres/README.md. Role dedicada orchestration_app.
      DATABASE_URL: ${DATABASE_URL}
      PROC_PATH: /host/proc
      CPU_THRESHOLD: ${CPU_THRESHOLD:-85}
      RAM_THRESHOLD: ${RAM_THRESHOLD:-90}
      DISK_THRESHOLD: ${DISK_THRESHOLD:-80}
      RAILS_LOG_TO_STDOUT: "true"
      RAILS_SERVE_STATIC_FILES: "true"
      RAILS_MAX_THREADS: ${RAILS_MAX_THREADS:-16}
      # Without this, Puma never loads the Solid Queue plugin (see
      # config/puma.rb) — GitDeployJob and any other perform_later just
      # sit in the jobs table forever with nothing to pick them up. This
      # is what made every Git deploy get stuck on "deploying" with no
      # output: the job that's supposed to actually run it never started.
      SOLID_QUEUE_IN_PUMA: "true"
      # Git stacks get cloned here. Must be the SAME path inside the
      # container and on the host (see bind mount below + entrypoint
      # comment) so compose files with relative bind mounts (./app:/app)
      # resolve to a real location once the host's own daemon picks up
      # the "docker stack deploy" this container issues over the socket.
      GIT_WORKSPACE_HOST_PATH: ${GIT_WORKSPACE_HOST_PATH:-/srv/redhusky/git-stacks}
      CLOUDFLARE_DNS_API_TOKEN: ${CLOUDFLARE_DNS_API_TOKEN:-cfut_uKgLFWpCLG7TT8gwuMf1rQ2hJ5R5nfYN4YAXfctB12c346cf}
      CLOUDFLARE_ZONE_ID: ${CLOUDFLARE_ZONE_ID:-2abf8a465c7243bdce700ca27de558a5}
      CF_ACCOUNT_ID: ${CF_ACCOUNT_ID:-85c7ebc56fe4c6aca4939b68af878c04}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /proc:/host/proc:ro
      - /srv/redhusky/security:/host/security:ro
      # Credenciais dos CLIs de IA, para a tela de Quotas. Precisa ser rw: os
      # provedores rotacionam o refresh token, entao quem renova tem que gravar
      # de volta no arquivo, senao o CLI fica com um token morto. Monta o
      # diretorio (nao o arquivo) porque a escrita e atomica via rename, que
      # troca o inode. Nao amplia privilegio: este servico ja monta o
      # docker.sock, que e root no host.
      - /root/.claude:/root/.claude
      - /root/.codex:/root/.codex
      - /root/.gemini:/root/.gemini
      - ${GIT_WORKSPACE_HOST_PATH:-/srv/redhusky/git-stacks}:${GIT_WORKSPACE_HOST_PATH:-/srv/redhusky/git-stacks}
    networks:
      - traefik
      - postgres-cluster
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        order: start-first
        delay: 10s
        failure_action: rollback
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 3
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=traefik"
        # Production
        - "traefik.http.routers.orchestration-prod.rule=Host(`orchestration.redhusky.com.br`)"
        - "traefik.http.routers.orchestration-prod.entrypoints=websecure"
        - "traefik.http.routers.orchestration-prod.tls.certresolver=letsencrypt"
        - "traefik.http.services.orchestration-prod.loadbalancer.server.port=80"

networks:
  traefik:
    external: true
  postgres-cluster:
    external: true
