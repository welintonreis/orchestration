default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  url: <%= ENV.fetch("DATABASE_URL") { "postgresql://localhost/orchestration_development" } %>

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  url: <%= ENV.fetch("DATABASE_URL") { "postgresql://localhost/orchestration_test" } %>

# App -> HAProxy -> PgBouncer -> Postgres (primary/réplicas). DATABASE_URL
# aponta pro service haproxy (ver ~/docker/postgres/README.md). Solid
# Cache/Queue/Cable reusam a mesma URL — tabelas namespaced, sem colisão
# (padrão do gerador Rails 8 quando não há bancos dedicados por serviço).
# Fallback nunca conecta de verdade — só evita KeyError no boot durante
# `assets:precompile` no build da imagem (DATABASE_URL não existe nesse
# estágio). Em runtime real, deploy-prod.sh sempre exporta DATABASE_URL.
production:
  primary:
    <<: *default
    url: <%= ENV.fetch("DATABASE_URL") { "postgresql://localhost/orchestration_production" } %>
  cache:
    <<: *default
    url: <%= ENV.fetch("DATABASE_URL") { "postgresql://localhost/orchestration_production" } %>
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    url: <%= ENV.fetch("DATABASE_URL") { "postgresql://localhost/orchestration_production" } %>
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    url: <%= ENV.fetch("DATABASE_URL") { "postgresql://localhost/orchestration_production" } %>
    migrations_paths: db/cable_migrate
