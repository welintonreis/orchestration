{{define "setup.html"}}
<!DOCTYPE html>
<html lang="pt-BR" class="h-full bg-gray-950">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Setup — Redhusk Orchestration</title>
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="h-full flex items-center justify-center">
  <div class="w-full max-w-sm">
    <div class="flex items-center justify-center gap-3 mb-8">
      <div class="w-10 h-10 rounded-xl bg-red-600 flex items-center justify-center">
        <svg class="w-6 h-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/>
        </svg>
      </div>
      <div>
        <h1 class="text-white font-bold text-lg">Redhusk</h1>
        <p class="text-gray-500 text-xs">Configuração inicial</p>
      </div>
    </div>

    <div class="bg-gray-900 border border-gray-800 rounded-xl p-6">
      <h2 class="text-gray-100 font-semibold text-sm mb-1">Criar conta admin</h2>
      <p class="text-gray-500 text-xs mb-5">Primeira execução. Crie o usuário administrador.</p>

      {{if .Data}}{{if index .Data "Error"}}
      <div class="mb-4 bg-red-900/40 border border-red-800 text-red-300 text-sm rounded-lg px-4 py-3">
        {{index .Data "Error"}}
      </div>
      {{end}}{{end}}

      <form method="POST" action="/setup" class="space-y-4">
        <div>
          <label class="block text-gray-400 text-xs font-medium mb-1.5">Usuário</label>
          <input
            type="text" name="username" required autofocus
            class="w-full bg-gray-800 border border-gray-700 text-gray-100 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-red-500 focus:ring-1 focus:ring-red-500"
            placeholder="admin"
          >
        </div>
        <div>
          <label class="block text-gray-400 text-xs font-medium mb-1.5">Senha <span class="text-gray-600">(mínimo 8 caracteres)</span></label>
          <input
            type="password" name="password" required minlength="8"
            class="w-full bg-gray-800 border border-gray-700 text-gray-100 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-red-500 focus:ring-1 focus:ring-red-500"
            placeholder="••••••••"
          >
        </div>
        <button
          type="submit"
          class="w-full bg-red-600 hover:bg-red-500 text-white font-medium rounded-lg px-4 py-2.5 text-sm transition-colors"
        >
          Criar e entrar
        </button>
      </form>
    </div>
  </div>
</body>
</html>
{{end}}
